
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pattern Codec v2</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .controls {
            background: #1e1e1e;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            border: 1px solid #333;
            width: fit-content;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        label { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
        input[type="file"] {
            padding: 8px;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #ccc;
            border-radius: 4px;
            cursor: pointer;
        }
        input[type="range"] { cursor: pointer; }
        button {
            padding: 8px 20px;
            background: #333;
            color: white;
            border: 1px solid #555;
            border-radius: 4px;
            font-weight: 500;
            cursor: pointer;
        }
        button:hover { background: #444; }
        
        .canvas-container {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }
        .canvas-box {
            background: #1e1e1e;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            border: 1px solid #333;
            flex: 1;
            min-width: 250px;
        }
        h3 { margin: 0 0 10px 0; font-size: 13px; color: #666; font-weight: normal; }
        canvas {
            background: #000;
            border: 1px solid #333;
            max-width: 100%;
            height: auto;
            image-rendering: pixelated; 
        }
        .info { margin-top: 5px; font-size: 11px; color: #444; }
    </style>
</head>
<body>

    <div class="controls">
        <div class="control-group">
            <label>Изображение</label>
            <input type="file" id="imageInput" accept="image/*">
        </div>
        
        <div class="control-group">
            <label>Порог (Чувствительность): <span id="threshVal">20</span></label>
            <input type="range" id="threshold" min="5" max="60" value="20">
        </div>

        <div class="control-group">
            <label>Контраст узора (Boost): <span id="boostVal">60</span></label>
            <input type="range" id="boost" min="10" max="120" value="60">
        </div>

        <div class="control-group">
            <label>Баланс Зелёного (при декоде): <span id="greenVal">1.0</span></label>
            <input type="range" id="greenScale" min="0.5" max="1.5" step="0.1" value="1.0">
        </div>

        <button id="analyzeBtn">Запустить</button>
    </div>

    <div class="canvas-container">
        <div class="canvas-box">
            <h3>1. Оригинал</h3>
            <canvas id="originalCanvas"></canvas>
        </div>
        <div class="canvas-box">
            <h3>2. Закодированный M-канал</h3>
            <canvas id="encodedCanvas"></canvas>
            <div class="info">Только Магента. Яркость пикселей модулирована паттерном.</div>
        </div>
        <div class="canvas-box">
            <h3>3. Восстановленный RGB</h3>
            <canvas id="decodedCanvas"></canvas>
            <div class="info">R и B восстановлены по узору. G скорректирован для баланса.</div>
        </div>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const originalCanvas = document.getElementById('originalCanvas');
        const encodedCanvas = document.getElementById('encodedCanvas');
        const decodedCanvas = document.getElementById('decodedCanvas');
        
        const ctxOrig = originalCanvas.getContext('2d');
        const ctxEnc = encodedCanvas.getContext('2d');
        const ctxDec = decodedCanvas.getContext('2d');

        const threshSlider = document.getElementById('threshold');
        const boostSlider = document.getElementById('boost');
        const greenSlider = document.getElementById('greenScale');

        threshSlider.oninput = () => document.getElementById('threshVal').innerText = threshSlider.value;
        boostSlider.oninput = () => document.getElementById('boostVal').innerText = boostSlider.value;
        greenSlider.oninput = () => {
            document.getElementById('greenVal').innerText = parseFloat(greenSlider.value).toFixed(1);
            if (sourceImage) analyzeBtn.click(); // Авто-обновление при движении ползунка
        };

        let sourceImage = null;

        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                sourceImage = new Image();
                sourceImage.onload = () => {
                    const maxSize = 600; 
                    let w = sourceImage.width;
                    let h = sourceImage.height;
                    
                    if (w > maxSize || h > maxSize) {
                        const ratio = Math.min(maxSize / w, maxSize / h);
                        w = Math.floor(w * ratio);
                        h = Math.floor(h * ratio);
                    }
                    
                    w = Math.floor(w / 4) * 4;
                    h = Math.floor(h / 4) * 4;

                    [originalCanvas, encodedCanvas, decodedCanvas].forEach(c => {
                        c.width = w; c.height = h;
                    });

                    ctxOrig.drawImage(sourceImage, 0, 0, w, h);
                };
                sourceImage.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        analyzeBtn.addEventListener('click', () => {
            if (!sourceImage) return;

            const w = originalCanvas.width;
            const h = originalCanvas.height;
            const origData = ctxOrig.getImageData(0, 0, w, h);
            const src = origData.data;

            const encData = ctxEnc.createImageData(w, h);
            const decData = ctxDec.createImageData(w, h);
            
            const enc = encData.data;
            const dec = decData.data;

            const bIdx = [0, 2, 8, 10]; 
            const rIdx = [5, 7, 13, 15]; 
            
            const threshold = parseInt(threshSlider.value);
            const boost = parseInt(boostSlider.value);
            const gScale = parseFloat(greenSlider.value);

            for (let y = 0; y < h; y += 4) {
                for (let x = 0; x < w; x += 4) {
                    let sumR = 0, sumB = 0;

                    // 1. Анализ блока для определения доминанты
                    for (let i = 0; i < 16; i++) {
                        const px = x + (i % 4);
                        const py = y + Math.floor(i / 4);
                        const p = (py * w + px) * 4;
                        sumR += src[p];
                        sumB += src[p + 2];
                    }

                    const diff = (sumR / 16) - (sumB / 16);
                    let isBlue = diff < -threshold;
                    let isRed = diff > threshold;

                    // 2. Обработка пикселей
                    for (let i = 0; i < 16; i++) {
                        const px = x + (i % 4);
                        const py = y + Math.floor(i / 4);
                        const p = (py * w + px) * 4;

                        const rVal = src[p];
                        const gVal = src[p + 1];
                        const bVal = src[p + 2];

                        // КЛЮЧЕВОЕ ИЗМЕНЕНИЕ: берем максимум, чтобы сохранить яркость доминирующего цвета
                        let baseM = Math.max(rVal, bVal);
                        let encodedM = baseM;

                        if (isBlue) {
                            if (bIdx.includes(i)) encodedM = Math.min(255, baseM + boost);
                            else if (rIdx.includes(i)) encodedM = Math.max(0, baseM - boost);
                        } 
                        else if (isRed) {
                            if (rIdx.includes(i)) encodedM = Math.min(255, baseM + boost);
                            else if (bIdx.includes(i)) encodedM = Math.max(0, baseM - boost);
                        }

                        // Запись в M-канал
                        enc[p] = encodedM;
                        enc[p + 1] = 0; 
                        enc[p + 2] = encodedM;
                        enc[p + 3] = 255;

                        // --- ДЕКОДИРОВАНИЕ ---
                        let recR = 0, recB = 0, recG = gVal;

                        if (isBlue) {
                            recB = encodedM;
                            recR = 0; 
                        } else if (isRed) {
                            recR = encodedM;
                            recB = 0; 
                        } else {
                            // Нейтральная зона: делим поровну, чтобы сохранить серый/белый
                            recR = encodedM;
                            recB = encodedM;
                        }

                        // Коррекция зеленого канала для компенсации изменения яркости R и B
                        // Если мы обнулили один канал, общий светлый тон может сместиться.
                        recG = Math.min(255, Math.max(0, recG * gScale));

                        dec[p] = recR;
                        dec[p + 1] = recG; 
                        dec[p + 2] = recB;
                        dec[p + 3] = 255;
                    }
                }
            }

            ctxEnc.putImageData(encData, 0, 0);
            ctxDec.putImageData(decData, 0, 0);
        });
    </script>
</body>
</html>
