
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Стример 1-бит Red Binary</title>
    <style>
        body{background:#0a0a0f;color:#e0e0e0;font-family:monospace;padding:10px;max-width:1000px;margin:0 auto}
        h3{color:#ff00ff;margin-bottom:4px}
        .sub{font-size:11px;color:#666;margin-bottom:16px}
        video{display:block;width:48%;height:auto;border-radius:8px;background:#000;border:1px solid #ff00ff;float:left;object-fit: cover;}
        canvas{width:48%;height:auto;border-radius:8px;background:#000;float:right;image-rendering: pixelated;}
        .clearfix{clear:both;height:0}
        button{width:100%;padding:14px;margin-top:10px;margin-bottom:5px;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;color:#fff;font-family:monospace}
        #start-btn{background:#ff00ff}
        #stop-btn{background:#555}
        #download-btn{background:#00ff9d;color:#0a0a0f}
        #clear-btn{background:#333;color:#ff4444;border:1px solid #ff4444}
        #status{margin-top:8px;font-size:12px;color:#888}
        .stats{display:flex;gap:8px;margin-top:12px}
        .stat{flex:1;background:#111;border:1px solid #333;border-radius:8px;padding:8px;text-align:center}
        .stat-label{font-size:10px;color:#888;text-transform:uppercase}
        .stat-value{font-size:16px;font-weight:700;color:#ff00ff}
        .button-row{display:flex;gap:10px}
        .button-row button{flex:1}
        .slider-container { margin: 10px 0; }
        label { display: block; margin-bottom: 5px; }
        input[type="range"] { width: 100%; }
    </style>
</head>
<body>
    <h3>🎬 Стример 1-бит Red Binary</h3>
    <div class="sub">Белый/Чёрный · Только R · Байер 4×4 | Лево: Оригинал | Право: 1-битный R рендер</div>

    <div class="slider-container">
        <label for="resolutionSlider">Ширина: <span id="widthDisplay">160</span>px (100%)</label>
        <input type="range" id="resolutionSlider" min="50" max="160" value="160" step="10">
    </div>

    <video id="cam" autoplay muted playsinline style="display:none;"></video>
    <video id="originalVideo" autoplay muted playsinline controls></video>
    <canvas id="c"></canvas>
    <div class="clearfix"></div>

    <div class="button-row">
        <button id="start-btn">▶ СТАРТ</button>
        <button id="stop-btn" style="display:none">⏹ СТОП</button>
    </div>

    <div id="status">Ожидание...</div>

    <div class="stats">
        <div class="stat"><span class="stat-label">Пакетов</span><div class="stat-value" id="packet-count">0</div></div>
        <div class="stat"><span class="stat-label">Кадров</span><div class="stat-value" id="frame-count">0/10</div></div>
        <div class="stat"><span class="stat-label">Файл</span><div class="stat-value" id="file-size">—</div></div>
    </div>

    <div class="button-row">
        <button id="download-btn" disabled>💾 СКАЧАТЬ .RED</button>
        <button id="clear-btn">🗑 ОЧИСТИТЬ</button>
    </div>

    <script>
        const video=document.getElementById('cam');
        const originalVideo = document.getElementById('originalVideo');
        const canvas=document.getElementById('c');
        const ctx=canvas.getContext('2d');
        const startBtn=document.getElementById('start-btn');
        const stopBtn=document.getElementById('stop-btn');
        const downloadBtn=document.getElementById('download-btn');
        const statusEl=document.getElementById('status');
        const resolutionSlider = document.getElementById('resolutionSlider');
        const widthDisplay = document.getElementById('widthDisplay');

        let TARGET_WIDTH = parseInt(resolutionSlider.value); // Начальное значение

        const FRAMES_PER_PACKET=10;
        const CAPTURE_INTERVAL=100;

        const BAYER4=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];

        let streaming=false;
        let animationId=null;
        let frameBuffer=[];
        let packetStartTime=0;

        let allPacketsBinary = [];

        // Обновление ширины при изменении ползунка
        resolutionSlider.oninput = function() {
            TARGET_WIDTH = parseInt(this.value);
            widthDisplay.textContent = `${TARGET_WIDTH} (${Math.round((TARGET_WIDTH / 160) * 100)}%)`;
        };

        function getThreshold(x,y){return BAYER4[y%4][x%4]/16.0}

        function thresholdRed(value,x,y){
            const normalizedValue = value / 255.0;
            const thr = getThreshold(x,y);
            return normalizedValue > thr ? 1 : 0;
        }

        function createBinaryPacket(frames, width, height, timestamp) {
            const headerView = new DataView(new ArrayBuffer(16));
            headerView.setUint8(0, 'R'.charCodeAt(0));
            headerView.setUint8(1, 'E'.charCodeAt(0));
            headerView.setUint8(2, 'D'.charCodeAt(0));
            headerView.setUint8(3, 0);
            headerView.setUint32(4, frames.length, true);
            headerView.setUint32(8, width, true);
            headerView.setUint32(12, height, true);

            const headerBlob = new Blob([headerView.buffer]);
            const frameBlobs = frames.map(frameData => new Blob([new Uint8Array(atob(frameData).split('').map(c => c.charCodeAt(0)))]));
            const packetBlob = new Blob([headerBlob, ...frameBlobs]);
            return packetBlob.arrayBuffer();
        }

        function packFrame(levelsR,w,h){
            const totalBits = w * h;
            const byteLength = Math.ceil(totalBits / 8);
            const bytes=new Uint8Array(byteLength);
            let bitIndex = 0;
            let byteIndex = 0;
            let currentByte = 0;

            for(let i = 0; i < totalBits; i++){
                const bitVal = levelsR[i];
                currentByte |= (bitVal << (7 - (bitIndex % 8)));
                bitIndex++;

                if((bitIndex % 8) === 0 || i === totalBits - 1){
                    bytes[byteIndex] = currentByte;
                    byteIndex++;
                    currentByte = 0;
                }
            }
            return bytes;
        }

        function toBase64(bytes){
            let binary=''; for(let i=0;i<bytes.length;i++)binary+=String.fromCharCode(bytes[i]); return btoa(binary);
        }

        function savePacket(frames, startTime, width, height){
            try {
                const packetBufferPromise = createBinaryPacket(frames, width, height, startTime);
                packetBufferPromise.then(buffer => {
                    allPacketsBinary.push(buffer);
                    document.getElementById('packet-count').textContent = allPacketsBinary.length;
                    const totalSize = allPacketsBinary.reduce((acc, buf) => acc + buf.byteLength, 0);
                    document.getElementById('file-size').textContent = (totalSize / 1024).toFixed(1) + ' KB';
                    statusEl.textContent='🔴 LIVE — пакет #'+allPacketsBinary.length;
                    downloadBtn.disabled = false;
                });
            } catch(e) { console.error(e); }
        }

        function captureFrame(){
            if(!streaming)return;
            if(video.readyState<2){animationId=setTimeout(captureFrame,CAPTURE_INTERVAL);return}

            const vw=video.videoWidth;
            const vh=video.videoHeight;
            if(vw===0||vh===0){animationId=setTimeout(captureFrame,CAPTURE_INTERVAL);return}

            const aspect=vh/vw;
            const outW=TARGET_WIDTH; // Используем текущее значение из слайдера
            const outH=Math.max(20,Math.round(TARGET_WIDTH*aspect));
            canvas.width=outW;
            canvas.height=outH;

            ctx.drawImage(video,0,0,outW,outH);
            const imageData=ctx.getImageData(0,0,outW,outH);
            const pixels=imageData.data;

            const levelsR=new Uint8Array(outW*outH);

            for(let y=0;y<outH;y++){
                for(let x=0;x<outW;x++){
                    const idx=(y*outW+x)*4;
                    levelsR[y*outW+x]=thresholdRed(pixels[idx],x,y);
                }
            }

            const outputImageData = ctx.createImageData(outW, outH);
            for(let i = 0; i < outW * outH; i++){
                const val = levelsR[i] ? 255 : 0;
                outputImageData.data[i*4] = val;
                outputImageData.data[i*4+1] = 0;
                outputImageData.data[i*4+2] = 0;
                outputImageData.data[i*4+3] = 255;
            }
            ctx.putImageData(outputImageData, 0, 0);

            const packed=packFrame(levelsR,outW,outH);
            const b64=toBase64(packed);
            frameBuffer.push(b64);
            document.getElementById('frame-count').textContent=frameBuffer.length+'/10';

            if(frameBuffer.length>=FRAMES_PER_PACKET){
                savePacket([...frameBuffer], packetStartTime, outW, outH);
                frameBuffer.length=0;
                packetStartTime=Date.now()
            }

            if(streaming)animationId=setTimeout(captureFrame,CAPTURE_INTERVAL)
        }

        async function start(){
            try{
                const stream=await navigator.mediaDevices.getUserMedia({
                    video:{width:{ideal:640},height:{ideal:480},frameRate:{ideal:30}},
                    audio:false
                });
                video.srcObject=stream;
                await video.play();
                originalVideo.srcObject = stream;
                streaming=true;
                startBtn.style.display='none';
                stopBtn.style.display='block';
                frameBuffer.length=0;
                packetStartTime=Date.now();
                document.getElementById('frame-count').textContent='0/10';
                statusEl.textContent=`🔴 LIVE — 1-бит Red Binary (${TARGET_WIDTH}px)`;
                captureFrame()
            }catch(e){
                statusEl.textContent='❌ Ошибка камеры: '+e.message
            }
        }

        function stop(){
            streaming=false;
            if(animationId){clearTimeout(animationId);animationId=null}
            if(frameBuffer.length>0){
                const vw=video.videoWidth;
                const vh=video.videoHeight;
                const aspect=vh/vw;
                const outW=TARGET_WIDTH; // Используем текущее значение
                const outH=Math.max(20,Math.round(TARGET_WIDTH*aspect));
                savePacket([...frameBuffer], packetStartTime, outW, outH);
                frameBuffer.length=0;
            }
            if(video.srcObject){video.srcObject.getTracks().forEach(t=>t.stop());video.srcObject=null}
            startBtn.style.display='block';
            stopBtn.style.display='none';
            statusEl.textContent='⏹ Остановлен'
        }

        startBtn.addEventListener('click',start);
        stopBtn.addEventListener('click',stop);

        downloadBtn.addEventListener('click', ()=>{
            if(allPacketsBinary.length === 0) {
                statusEl.textContent = 'Нечего скачивать';
                return;
            }
            const totalSize = allPacketsBinary.reduce((acc, buf) => acc + buf.byteLength, 0);
            const fullBuffer = new Uint8Array(totalSize);
            let offset = 0;
            allPacketsBinary.forEach(buf => {
                fullBuffer.set(new Uint8Array(buf), offset);
                offset += buf.byteLength;
            });
            const blob = new Blob([fullBuffer], {type: 'application/octet-stream'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'stream.red';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            statusEl.textContent = '✅ Файл .red сохранён';
        });

        document.getElementById('clear-btn').addEventListener('click', ()=>{
            allPacketsBinary = [];
            document.getElementById('packet-count').textContent='0';
            document.getElementById('file-size').textContent='—';
            downloadBtn.disabled = true;
            statusEl.textContent='🗑 Очищено'
        });
    </script>
</body>
</html>
