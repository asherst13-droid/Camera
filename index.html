
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>v9.0 (1-Bit Flag)</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #e0e0e0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .controls { background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; gap: 20px; border: 1px solid #333; }
        .control-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 12px; color: #888; text-transform: uppercase; }
        input[type="file"] { padding: 8px; background: #2a2a2a; border: 1px solid #444; color: #ccc; border-radius: 4px; }
        input[type="range"] { cursor: pointer; }
        button { padding: 8px 20px; background: #333; color: white; border: 1px solid #555; border-radius: 4px; cursor: pointer; }
        button:hover { background: #444; }
        .canvas-container { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; width: 100%; }
        .canvas-box { background: #1e1e1e; padding: 10px; border-radius: 6px; text-align: center; border: 1px solid #333; flex: 1; min-width: 250px; }
        h3 { margin: 0 0 10px 0; font-size: 13px; color: #666; font-weight: normal; }
        canvas { background: #000; border: 1px solid #333; max-width: 100%; height: auto; image-rendering: pixelated; }
        .info { font-size: 11px; color: #555; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="controls">
        <div class="control-group">
            <label>Файл</label>
            <input type="file" id="imageInput" accept="image/*">
        </div>
        <div class="control-group">
            <label>Сила разделения (Offset): <span id="offsetVal">60</span></label>
            <input type="range" id="offset" min="0" max="120" value="60">
        </div>
        <button id="analyzeBtn">Старт</button>
    </div>

    <div class="canvas-container">
        <div class="canvas-box">
            <h3>Оригинал</h3>
            <canvas id="originalCanvas"></canvas>
        </div>
        <div class="canvas-box">
            <h3>Код (M + 1-bit флаг в Alpha)</h3>
            <canvas id="encodedCanvas"></canvas>
            <div class="info">Alpha = 255 (флаг 1: Red), Alpha = 0 (флаг 0: Blue)</div>
        </div>
        <div class="canvas-box">
            <h3>Декод (Чтение M + Флаг)</h3>
            <canvas id="decodedCanvas"></canvas>
        </div>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const originalCanvas = document.getElementById('originalCanvas');
        const encodedCanvas = document.getElementById('encodedCanvas');
        const decodedCanvas = document.getElementById('decodedCanvas');
        
        const ctxOrig = originalCanvas.getContext('2d');
        const ctxEnc = encodedCanvas.getContext('2d');
        const ctxDec = decodedCanvas.getContext('2d');
        const offsetSlider = document.getElementById('offset');

        offsetSlider.oninput = () => {
            document.getElementById('offsetVal').innerText = offsetSlider.value;
            if (sourceImage) analyzeBtn.click();
        };

        let sourceImage = null;

        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                sourceImage = new Image();
                sourceImage.onload = () => {
                    const maxSize = 600; 
                    let w = sourceImage.width, h = sourceImage.height;
                    if (w > maxSize || h > maxSize) {
                        const ratio = Math.min(maxSize / w, maxSize / h);
                        w = Math.floor(w * ratio); h = Math.floor(h * ratio);
                    }
                    [originalCanvas, encodedCanvas, decodedCanvas].forEach(c => { c.width = w; c.height = h; });
                    ctxOrig.drawImage(sourceImage, 0, 0, w, h);
                };
                sourceImage.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        analyzeBtn.addEventListener('click', () => {
            if (!sourceImage) return;
            const w = originalCanvas.width, h = originalCanvas.height;
            const origData = ctxOrig.getImageData(0, 0, w, h);
            const src = origData.data;
            const encData = ctxEnc.createImageData(w, h);
            const decData = ctxDec.createImageData(w, h);
            const enc = encData.data, dec = decData.data;
            const offset = parseInt(offsetSlider.value);

            for (let i = 0; i < src.length; i += 4) {
                const origR = src[i], origG = src[i+1], origB = src[i+2];
                
                // 1. КОДИРОВАНИЕ
                const M = Math.round((origR + origB) / 2);
                // 1-битный флаг: 1 если красный доминирует, 0 если синий
                const flag = (origR > origB) ? 1 : 0; 

                // Записываем M в R и B каналы. Флаг прячем в Alpha (в реальном бинарнике это отдельный битовый поток)
                enc[i] = M;
                enc[i+1] = origG; // Для наглядности оставим G, чтобы картинка не была черно-белой
                enc[i+2] = M;
                enc[i+3] = flag * 255; 

                // 2. ДЕКОДИРОВАНИЕ (Чтение только из enc)
                const decodedM = enc[i];
                const decodedFlag = enc[i+3] === 255 ? 1 : 0;
                const decodedG = enc[i+1];

                let decR, decB;

                if (decodedFlag === 1) {
                    // Флаг говорит: "Здесь был сдвиг в красный"
                    decR = Math.min(255, decodedM + offset);
                    decB = Math.max(0, decodedM - offset);
                } else {
                    // Флаг говорит: "Здесь был сдвиг в синий"
                    decB = Math.min(255, decodedM + offset);
                    decR = Math.max(0, decodedM - offset);
                }

                dec[i] = decR;
                dec[i+1] = decodedG;
                dec[i+2] = decB;
                dec[i+3] = 255;
            }

            ctxEnc.putImageData(encData, 0, 0);
            ctxDec.putImageData(decData, 0, 0);
        });
    </script>
</body>
</html>
