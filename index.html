<!DOCTYPE html>
<html lang="ru">
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анализатор Магента-Паттернов (4x4)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #e0e0e0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 { color: #ff00ff; text-shadow: 0 0 10px #ff00ff; }
        .controls {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            border: 1px solid #444;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        label { font-size: 14px; color: #aaa; }
        input[type="file"] {
            padding: 10px;
            background: #333;
            border: 1px solid #555;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }
        button {
            padding: 10px 20px;
            background: #ff00ff;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background: #d400d4; box-shadow: 0 0 15px #ff00ff; }
        
        .canvas-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .canvas-box {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid #444;
        }
        canvas {
            background: #000;
            border: 1px solid #555;
            max-width: 100%;
            height: auto;
            image-rendering: pixelated; /* Важно для чёткости пикселей! */
        }
        .legend {
            margin-top: 10px;
            font-size: 12px;
            color: #888;
            text-align: left;
        }
        .legend span { display: inline-block; width: 12px; height: 12px; margin-right: 5px; vertical-align: middle; }
        .red-box { background: #ff0055; }
        .blue-box { background: #0055ff; }
    </style</head>
<body>

    <h2>🔮 Магента-Паттерн: Кодирование R/B в 4x4</h2>

    <div class="controls">
        <div class="control-group">
            <label>1. Загрузите изображение:</label>
            <input type="file" id="imageInput" accept="image/*">
        </div>
        
        <div class="control-group">
            <label>2. Порог различия R и B (чувствительность): <span id="threshVal">30</span></label>
            <input type="range" id="threshold" min="0" max="100" value="30">
        </div>

        <div class="control-group">
            <label>3. Сила эффекта (контраст паттерна): <span id="boostVal">150</span></label>
            <input type="range" id="boost" min="0" max="255" value="150">
        </div>

        <button id="analyzeBtn">🚀 АНАЛИЗ</button>
    </div>

    <div class="canvas-container">
        <div class="canvas-box">
            <h3>Оригинал (уменьшенный)</h3>
            <canvas id="originalCanvas"></canvas>
        </div>
        <div class="canvas-box">
            <h3>Магента-канал с паттерном (Zoom x8)</h3>
            <canvas id="patternCanvas"></canvas>
            <div class="legend">
                <div><span class="blue-box"></span> Ярче = Доминирует СИНИЙ (позиции 1, 3, 9, 11)</div>
                <div><span class="red-box"></span> Ярче = Доминирует КРАСНЫЙ (позиции 6, 8, 14, 16)</div>
                <div style="margin-top:5px; color:#aaa;">Каждый "пиксель" увеличен для наглядности структуры.</div>
            </div>
        </div
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const originalCanvas = document.getElementById('originalCanvas');
        const patternCanvas = document.getElementById('patternCanvas');
        const ctxOrig = originalCanvas.getContext('2d');
        const ctxPat = patternCanvas.getContext('2d');
        
        const threshSlider = document.getElementById('threshold');
        const boostSlider = document.getElementById('boost');
        
        threshSlider.oninput = () => document.getElementById('threshVal').innerText = threshSlider.value;
        boostSlider.oninput = () => document.getElementById('boostVal').innerText = boostSlider.value;

        let sourceImage = null;

        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                sourceImage = new Image();
                sourceImage.onload = () => {
                    // Ограничиваем размер для быстродействия и наглядности
                    const maxSize = 200; 
                    let w = sourceImage.width;
                    let h = sourceImage.height;
                    if (w > h) { h = (h / w) * maxSize; w = maxSize; }
                    else { w = (w / h) * maxSize; h = maxSize; }
                    
                    // Округляем до кратного 4, чтобы блоки были ровными
                    w = Math.floor(w / 4) * 4;
                    h = Math.floor(h / 4) * 4;

                    originalCanvas.width = w;
                    originalCanvas.height = h;
                    ctxOrig.drawImage(sourceImage, 0, 0, w, h);
                };
                sourceImage.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        analyzeBtn.addEventListener('click', () => {
            if (!sourceImage) { alert("Сначала загрузите картинку!"); return; }
            
            const w = originalCanvas.width;
            const h = originalCanvas.height;
            const imgData = ctxOrig.getImageData(0, 0, w, h);
            const data = imgData.data;

            // Настройки паттерна из твоей схемы (индексы 0-15 в блоке 4x4)
            // B: 0, 2, 8, 10  (визуально: 1-й, 3-й, 9-й, 11-й пиксели)
            const blueIndices = [0, 2, 8, 10];
            // R: 5, 7, 13, 15 (визуально: 6-й, 8-й, 14-й, 16-й пиксели)
            const redIndices = [5, 7, 13, 15];
            // Остальные пиксели шахматки (для базового уровня)
            const baseIndices = [1, 3, 4, 6, 9, 11, 12, 14]; 
            // Пустые клетки шахматки (черные)
            const emptyIndices = [1, 3, 4, 6, 9, 11, 12, 14]; // Упростим: сделаем честную шахматку

            // Честная шахматка мадженты:
            // X 0 X 0
            // 0 X 0 X
            // X 0 X 0
            // 0 X 0 X
            // Индексы X: 0, 2, 5, 7, 8, 10, 13, 15
            // Индексы 0: 1, 3, 4, 6, 9, 11, 12, 14
            
            const checkerActive = [0, 2, 5, 7, 8, 10, 13, 15];
            const checkerInactive = [1, 3, 4, 6, 9, 11, 12, 14];

            const threshold = parseInt(threshSlider.value);
            const boost = parseInt(boostSlider.value);
            const baseBrightness = 100; // Базовая яркость мадженты

            // Создаем новое изображение для паттерна
            // Мы увеличим его в 8 раз для наглядности (Zoom)
            const zoom = 8;
            patternCanvas.width = w * zoom;
            patternCanvas.height = h * zoom;
            const patData = ctxPat.createImageData(patternCanvas.width, patternCanvas.height);

            for (let y = 0; y < h; y += 4) {
                for (let x = 0; x < w; x += 4) {
                    let sumR = 0, sumB = 0;
                    
                    // 1. Анализируем блок 4x4
                    for (let by = 0; by < 4; by++) {
                        for (let bx = 0; bx < 4; bx++) {
                            const idx = ((y + by) * w + (x + bx)) * 4;
                            sumR += data[idx];     // Red
                            sumB += data[idx + 2]; // Blue
                        }
                    }
                    const avgR = sumR / 16;
                    const avgB = sumB / 16;
                    const diff = avgR - avgB;

                    // 2. Определяем доминирование
                    let state = 'neutral'; // neutral, red, blue
                    if (diff > threshold) state = 'red';
                    else if (diff < -threshold) state = 'blue';

                    // 3. Формируем паттерн для этого блока
                    for (let i = 0; i < 16; i++) {
                        let brightness = 0;
                        const bx = i % 4;
                        const by = Math.floor(i / 4);
                        
                        // Является ли этот пиксель частью "Синей" группы усиления?
                        const isBluePos = blueIndices.includes(i);
                        // Является ли этот пиксель частью "Красной" группы усиления?
                        const isRedPos = redIndices.includes(i);
                        // Является ли пиксель частью базовой шахматки, но не в группах усиления?
                        const isBasePos = checkerActive.includes(i) && !isBluePos && !isRedPos;

                        if (state === 'blue') {
                            if (isBluePos) brightness = baseBrightness + boost;
                            else if (isBasePos) brightness = baseBrightness - (boost * 0.5);
                            else brightness = 0; // checkerInactive
                        } 
                        else if (state === 'red') {
                            if (isRedPos) brightness = baseBrightness + boost;
                            else if (isBasePos) brightness = baseBrightness - (boost * 0.5);
                            else brightness = 0; // checkerInactive
                        } 
                        else {
                            // Neutral: обычная шахматка без перекосов
                            if (checkerActive.includes(i)) brightness = baseBrightness;
                            else brightness = 0;
                        }

                        // Ограничиваем яркость от 0 до 255
                        brightness = Math.max(0, Math.min(255, brightness));

                        // 4. Рисуем этот "пиксель" увеличенным (zoom x zoom) на выходном канвасе
                        // Цвет всегда Магента (R=255, B=255), меняется только яркость (через альфа-канал или умножение)
                        // Для наглядности сделаем чистый маджента с яркостью
                        const r = brightness;
                        const g = 0; // Зеленый выкидываем, как ты и просил
                        const b = brightness;

                        for (let zy = 0; zy < zoom; zy++) {
                            for (let zx = 0; zx < zoom; zx++) {
                                const px = (x + bx) * zoom + zx;
                                const py = (y + by) * zoom + zy;
                                const pIdx = (py * patternCanvas.width + px) * 4;
                                
                                patData.data[pIdx] = r;
                                patData.data[pIdx + 1] = g;
                                patData.data[pIdx + 2] = b;
                                patData.data[pIdx + 3] = 255; // Alpha
                            }
                        }
                    }
                }
            }

            ctxPat.putImageData(patData, 0, 0);
        });
    </script>
</body>
  </html>
