
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Green-Magenta Codec · 300×300 · 13 FPS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a1a; min-height: 100vh; display: flex; justify-content: center; align-items: center; font-family: 'Courier New', monospace; padding: 20px; }
        .container { display: flex; flex-direction: column; align-items: center; gap: 15px; max-width: 800px; width: 100%; }
        .canvas-row { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .canvas-wrapper { background: #000; border: 2px solid #2a4a2a; }
        canvas { display: block; image-rendering: crisp-edges; image-rendering: pixelated; width: 300px; height: 300px; }
        label { color: #aaa; font-size: 12px; display: block; margin-bottom: 4px; text-align: center; }
        button { background: #1a3a1a; border: 1px solid #3a6a3a; color: #ddd; padding: 10px 18px; font-family: monospace; border-radius: 30px; cursor: pointer; font-size: 14px; font-weight: bold; }
        button:hover:not(:disabled) { background: #4a8a4a; }
        button:disabled { opacity: 0.3; cursor: not-allowed; }
        #startBtn { background: #2a6a2a; border-color: #4aaa4a; }
        #stopBtn { background: #4a2a4a; border-color: #8a4a8a; }
        #downloadBtn { background: #4a4a2a; border-color: #8a8a4a; }
        #clearBtn { background: #3a1a2a; border-color: #6a3a4a; }
        .status { color: #aaa; font-size: 11px; background: #111; padding: 8px 14px; border-radius: 30px; text-align: center; width: 100%; }
        .controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; width: 100%; }
        .stats { display: flex; gap: 10px; width: 100%; justify-content: space-around; flex-wrap: wrap; }
        .stat { background: #111; border: 1px solid #333; border-radius: 8px; padding: 8px; text-align: center; flex: 1; min-width: 80px; }
        .stat-label { font-size: 9px; color: #888; text-transform: uppercase; }
        .stat-value { font-size: 14px; font-weight: bold; color: #00ff88; }
        .palette { display: flex; gap: 4px; margin-top: 5px; align-items: center; flex-wrap: wrap; justify-content: center; }
        .color-box { width: 24px; height: 24px; border: 1px solid #333; }
        .palette-label { color: #666; font-size: 10px; margin: 0 6px; }
        .info { color: #555; font-size: 10px; text-align: center; max-width: 600px; line-height: 1.5; margin-top: 5px; }
    </style>
</head>
<body>
<div class="container">
    <div class="canvas-row">
        <div>
            <label>ОРИГИНАЛ</label>
            <div class="canvas-wrapper"><canvas id="origCanvas" width="300" height="300"></canvas></div>
        </div>
        <div>
            <label>G-M КОДЕК (13 FPS)</label>
            <div class="canvas-wrapper"><canvas id="outCanvas" width="300" height="300"></canvas></div>
        </div>
    </div>

    <div class="palette">
        <span class="palette-label">Сдвиг маженты:</span>
        <div class="color-box" style="background:#ffff00" title="0: Жёлтый (M→R)"></div>
        <div class="color-box" style="background:#ffcc88" title="2"></div>
        <div class="color-box" style="background:#ffffff" title="5: Белый (нейтрально)"></div>
        <div class="color-box" style="background:#88ccff" title="7"></div>
        <div class="color-box" style="background:#00ffff" title="9: Циан (M→B)"></div>
    </div>

    <div class="controls">
        <button id="startBtn">▶ СТАРТ</button>
        <button id="stopBtn" disabled>⏹ СТОП</button>
    </div>

    <div class="stats">
        <div class="stat"><span class="stat-label">Кадров</span><div class="stat-value" id="frameCount">0</div></div>
        <div class="stat"><span class="stat-label">Пакетов</span><div class="stat-value" id="packetCount">0</div></div>
        <div class="stat"><span class="stat-label">Размер</span><div class="stat-value" id="fileSize">—</div></div>
        <div class="stat"><span class="stat-label">КБ/сек</span><div class="stat-value" id="kbPerSec">—</div></div>
    </div>

    <div class="controls">
        <button id="downloadBtn" disabled>📤 СКАЧАТЬ .GM</button>
        <button id="clearBtn">🗑 ОЧИСТИТЬ</button>
    </div>

    <div class="status" id="statusText">⚡ G-M Codec · 2 байта/пиксель · 13 FPS ⚡</div>
    <div class="info">
        G-канал: 4 бита глубины (0-15) · M-канал: 3 бита глубины (0-7) + 4 бита сдвига (0-9)<br>
        Сдвиг 0-4 → жёлтые оттенки · 5 → белый · 6-9 → циановые оттенки
    </div>
</div>

<video id="cam" autoplay muted playsinline style="display:none;"></video>

<script>
(function() {
    const cam = document.getElementById('cam');
    const origCanvas = document.getElementById('origCanvas');
    const outCanvas = document.getElementById('outCanvas');
    const origCtx = origCanvas.getContext('2d');
    const outCtx = outCanvas.getContext('2d');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const clearBtn = document.getElementById('clearBtn');
    const statusDiv = document.getElementById('statusText');
    const frameCountEl = document.getElementById('frameCount');
    const packetCountEl = document.getElementById('packetCount');
    const fileSizeEl = document.getElementById('fileSize');
    const kbPerSecEl = document.getElementById('kbPerSec');

    const W = 300, H = 300;
    const FPS_INTERVAL = 77;
    const FRAMES_PER_PACKET = 13;

    // Bayer 4×4 для G и M-глубины
    const BAYER4 = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
    function bayer(x,y) { return BAYER4[y%4][x%4]/16.0; }

    // Blue noise для сдвига (стохастический паттерн)
    function blueNoise(x, y, frame) {
        let h = (x * 73856093) ^ (y * 19349663) ^ (frame * 83492791);
        h = ((h >> 16) ^ h) * 0x45d9f3b;
        h = ((h >> 16) ^ h) * 0x45d9f3b;
        return ((h >> 16) ^ h) & 0xFF;
    }

    // Извлечение G и M из RGB
    function extractGM(r, g, b) {
        // Зелёный канал
        const green = g;
        // Мажента = R + B (отсутствие зелёного)
        const magenta = (r + b) / 2;
        return { green, magenta };
    }

    // Квантование G (4 бита, 0-15) с Bayer
    function quantizeG(value, x, y) {
        const norm = value / 255.0;
        let level = Math.floor(norm * 16);
        if (level >= 16) level = 15;
        const lower = level / 16.0;
        const upper = (level + 1) / 16.0;
        const local = (norm - lower) / (upper - lower);
        if (local > bayer(x, y) && level < 15) level++;
        return level;
    }

    // Квантование M-глубины (3 бита, 0-7) с Bayer
    function quantizeMDepth(value, x, y) {
        const norm = value / 255.0;
        let level = Math.floor(norm * 8);
        if (level >= 8) level = 7;
        const lower = level / 8.0;
        const upper = (level + 1) / 8.0;
        const local = (norm - lower) / (upper - lower);
        // Сдвиг матрицы для разнесения с G
        if (local > bayer(x+2, y+2) && level < 7) level++;
        return level;
    }

    // Квантование сдвига (0-9) с blue noise
    function quantizeShift(r, g, b, x, y, frame) {
        // Определяем баланс R и B в маженте
        const magenta = (r + b) / 2;
        if (magenta < 20) return 5; // нейтрально при слабой маженте
        
        // Отношение R к B определяет сдвиг
        const ratio = r / (r + b + 1); // 0..1
        // 0 → чистый B (циан) → сдвиг 9
        // 0.5 → баланс → сдвиг 5
        // 1 → чистый R (жёлтый) → сдвиг 0
        
        let shift = Math.round((1 - ratio) * 9);
        
        // Дизеринг через blue noise
        const noise = blueNoise(x, y, frame) / 255.0;
        const fractional = ((1 - ratio) * 9) % 1;
        if (noise < fractional && shift < 9) shift++;
        
        return Math.max(0, Math.min(9, shift));
    }

    // Восстановление цвета из G, M-depth, shift
    function reconstructColor(gLevel, mLevel, shift) {
        // G-интенсивность (0-255)
        const gIntensity = (gLevel / 15) * 255;
        
        // M-интенсивность (0-255)
        const mIntensity = (mLevel / 7) * 255;
        
        // Базовый белый = G + M
        let r = mIntensity;
        let g = gIntensity;
        let b = mIntensity;
        
        // Сдвиг маженты
        // 0-4: сдвиг к красному (жёлтые оттенки)
        // 5: нейтрально (белый)
        // 6-9: сдвиг к синему (циановые оттенки)
        
        if (shift < 5) {
            // Сдвиг к красному
            const t = (5 - shift) / 5; // 0..1
            r = mIntensity * (1 + t);
            b = mIntensity * (1 - t);
        } else if (shift > 5) {
            // Сдвиг к синему
            const t = (shift - 5) / 4; // 0..1
            r = mIntensity * (1 - t);
            b = mIntensity * (1 + t);
        }
        
        return [
            Math.min(255, Math.max(0, Math.round(r))),
            Math.min(255, Math.max(0, Math.round(g))),
            Math.min(255, Math.max(0, Math.round(b)))
        ];
    }

    // Упаковка кадра: 2 байта на пиксель
    // Байт 1: G (4 бита) + M-depth (4 бита, используем 0-7)
    // Байт 2: shift (4 бита, 0-9) + padding (4 бита)
    function packFrame(gLevels, mDepths, shifts) {
        const bytes = new Uint8Array(W * H * 2);
        for (let i = 0; i < W * H; i++) {
            bytes[i * 2] = (gLevels[i] << 4) | (mDepths[i] & 0x0F);
            bytes[i * 2 + 1] = (shifts[i] << 4) | 0x00;
        }
        return bytes;
    }

    // RLE по байтам
    function rleEncode(bytes) {
        const chunks = [];
        let i = 0;
        while (i < bytes.length) {
            const val = bytes[i];
            let count = 1;
            while (i + count < bytes.length && bytes[i + count] === val && count < 65535) count++;
            chunks.push({ val, count });
            i += count;
        }
        const out = new Uint8Array(chunks.length * 3);
        for (let j = 0; j < chunks.length; j++) {
            out[j * 3] = chunks[j].val;
            out[j * 3 + 1] = chunks[j].count & 0xFF;
            out[j * 3 + 2] = (chunks[j].count >> 8) & 0xFF;
        }
        return out;
    }

    function createPacket(frames) {
        const hdr = new DataView(new ArrayBuffer(16));
        hdr.setUint8(0,'G'.charCodeAt(0));
        hdr.setUint8(1,'M'.charCodeAt(0));
        hdr.setUint8(2,'C'.charCodeAt(0));
        hdr.setUint8(3,'D'.charCodeAt(0));
        hdr.setUint32(4, frames.length, true);
        hdr.setUint32(8, W, true);
        hdr.setUint32(12, H, true);
        return new Blob([hdr.buffer, ...frames.map(f => new Blob([f]))]).arrayBuffer();
    }

    let active = false, timeout = null, frameBuf = [], packets = [], startTime = 0;
    let globalFrame = 0;

    function savePacket(frames) {
        createPacket(frames).then(buf => {
            packets.push(buf);
            packetCountEl.textContent = packets.length;
            const total = packets.reduce((a,b) => a + b.byteLength, 0);
            fileSizeEl.textContent = (total/1024).toFixed(1) + ' KB';
            const elapsed = (Date.now() - startTime) / 1000;
            kbPerSecEl.textContent = ((total/1024)/elapsed).toFixed(1);
            statusDiv.innerHTML = `🔴 LIVE — пакет #${packets.length} (${(buf.byteLength/1024).toFixed(1)} KB)`;
            downloadBtn.disabled = false;
        });
    }

    function capture() {
        if (!active) return;
        if (cam.readyState < 2) { timeout = setTimeout(capture, FPS_INTERVAL); return; }

        const vw = cam.videoWidth, vh = cam.videoHeight;
        if (!vw || !vh) { timeout = setTimeout(capture, FPS_INTERVAL); return; }

        const size = Math.min(vw, vh);
        const ox = (vw - size) / 2, oy = (vh - size) / 2;

        origCtx.drawImage(cam, ox, oy, size, size, 0, 0, W, H);
        const imgData = origCtx.getImageData(0, 0, W, H);
        const px = imgData.data;

        const gLevels = new Uint8Array(W*H);
        const mDepths = new Uint8Array(W*H);
        const shifts = new Uint8Array(W*H);
        const outImg = outCtx.createImageData(W, H);
        const out = outImg.data;

        for (let y = 0; y < H; y++) {
            for (let x = 0; x < W; x++) {
                const i = (y * W + x) * 4;
                const r = px[i], g = px[i+1], b = px[i+2];

                const { green, magenta } = extractGM(r, g, b);
                
                gLevels[y * W + x] = quantizeG(green, x, y);
                mDepths[y * W + x] = quantizeMDepth(magenta, x, y);
                shifts[y * W + x] = quantizeShift(r, g, b, x, y, globalFrame);

                const [cr, cg, cb] = reconstructColor(
                    gLevels[y * W + x],
                    mDepths[y * W + x],
                    shifts[y * W + x]
                );
                out[i] = cr; out[i+1] = cg; out[i+2] = cb; out[i+3] = 255;
            }
        }

        outCtx.putImageData(outImg, 0, 0);
        
        frameBuf.push(rleEncode(packFrame(gLevels, mDepths, shifts)));
        frameCountEl.textContent = parseInt(frameCountEl.textContent) + 1;
        globalFrame++;

        if (frameBuf.length >= FRAMES_PER_PACKET) {
            savePacket([...frameBuf]);
            frameBuf.length = 0;
        }

        if (active) timeout = setTimeout(capture, FPS_INTERVAL);
    }

    async function start() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { width:{ideal:640}, height:{ideal:480}, frameRate:{ideal:30} }, audio: false
            });
            cam.srcObject = stream;
            await cam.play();
            active = true;
            startBtn.disabled = true; stopBtn.disabled = false;
            frameBuf.length = 0; frameCountEl.textContent = '0';
            startTime = Date.now();
            globalFrame = 0;
            statusDiv.innerHTML = '🔴 LIVE · G-M Codec · 13 FPS';
            capture();
        } catch(e) { statusDiv.innerHTML = '❌ ' + e.message; }
    }

    function stop() {
        active = false;
        if (timeout) { clearTimeout(timeout); timeout = null; }
        if (frameBuf.length) { savePacket([...frameBuf]); frameBuf.length = 0; }
        if (cam.srcObject) { cam.srcObject.getTracks().forEach(t=>t.stop()); cam.srcObject = null; }
        startBtn.disabled = false; stopBtn.disabled = true;
        statusDiv.innerHTML = '⏹ Остановлен';
    }

    startBtn.onclick = start;
    stopBtn.onclick = stop;

    downloadBtn.onclick = () => {
        if (!packets.length) return;
        const total = packets.reduce((a,b) => a + b.byteLength, 0);
        const buf = new Uint8Array(total);
        let off = 0;
        packets.forEach(p => { buf.set(new Uint8Array(p), off); off += p.byteLength; });
        const blob = new Blob([buf], {type:'application/octet-stream'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'green_magenta.gm';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
        statusDiv.innerHTML = '✅ Файл .gm сохранён';
    };

    clearBtn.onclick = () => {
        packets = [];
        packetCountEl.textContent = '0';
        fileSizeEl.textContent = '—';
        kbPerSecEl.textContent = '—';
        downloadBtn.disabled = true;
        statusDiv.innerHTML = '🗑 Очищено';
    };

    origCtx.fillStyle = '#000'; origCtx.fillRect(0,0,W,H);
    outCtx.fillStyle = '#000'; outCtx.fillRect(0,0,W,H);
})();
</script>
</body>
</html>
