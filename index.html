
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>v4.0</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .controls {
            background: #1e1e1e;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            border: 1px solid #333;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        label { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
        input[type="file"] {
            padding: 8px;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #ccc;
            border-radius: 4px;
            cursor: pointer;
        }
        input[type="range"] { cursor: pointer; }
        button {
            padding: 8px 20px;
            background: #333;
            color: white;
            border: 1px solid #555;
            border-radius: 4px;
            font-weight: 500;
            cursor: pointer;
        }
        button:hover { background: #444; }
        
        .canvas-container {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }
        .canvas-box {
            background: #1e1e1e;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            border: 1px solid #333;
            flex: 1;
            min-width: 250px;
        }
        h3 { margin: 0 0 10px 0; font-size: 13px; color: #666; font-weight: normal; }
        canvas {
            background: #000;
            border: 1px solid #333;
            max-width: 100%;
            height: auto;
            image-rendering: pixelated; 
        }
    </style>
</head>
<body>

    <div class="controls">
        <div class="control-group">
            <label>Файл</label>
            <input type="file" id="imageInput" accept="image/*">
        </div>
        
        <div class="control-group">
            <label>Сила паттерна: <span id="boostVal">40</span></label>
            <input type="range" id="boost" min="0" max="100" value="40">
        </div>

        <button id="analyzeBtn">Старт</button>
    </div>

    <div class="canvas-container">
        <div class="canvas-box">
            <h3>Оригинал</h3>
            <canvas id="originalCanvas"></canvas>
        </div>
        <div class="canvas-box">
            <h3>Код</h3>
            <canvas id="encodedCanvas"></canvas>
        </div>
        <div class="canvas-box">
            <h3>Декод</h3>
            <canvas id="decodedCanvas"></canvas>
        </div</div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const originalCanvas = document.getElementById('originalCanvas');
        const encodedCanvas = document.getElementById('encodedCanvas');
        const decodedCanvas = document.getElementById('decodedCanvas');
        
        const ctxOrig = originalCanvas.getContext('2d');
        const ctxEnc = encodedCanvas.getContext('2d');
        const ctxDec = decodedCanvas.getContext('2d');

        const boostSlider = document.getElementById('boost');
        boostSlider.oninput = () => {
            document.getElementById('boostVal').innerText = boostSlider.value;
            if (sourceImage) analyzeBtn.click();
        };

        let sourceImage = null;

        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                sourceImage = new Image();
                sourceImage.onload = () => {
                    const maxSize = 600; 
                    let w = sourceImage.width;
                    let h = sourceImage.height;
                    
                    if (w > maxSize || h > maxSize) {
                        const ratio = Math.min(maxSize / w, maxSize / h);
                        w = Math.floor(w * ratio);
                        h = Math.floor(h * ratio);
                    }
                    
                    w = Math.floor(w / 4) * 4;
                    h = Math.floor(h / 4) * 4;

                    [originalCanvas, encodedCanvas, decodedCanvas].forEach(c => {
                        c.width = w; c.height = h;
                    });

                    ctxOrig.drawImage(sourceImage, 0, 0, w, h);
                };
                sourceImage.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        analyzeBtn.addEventListener('click', () => {
            if (!sourceImage) return;

            const w = originalCanvas.width;
            const h = originalCanvas.height;
            const origData = ctxOrig.getImageData(0, 0, w, h);
            const src = origData.data;

            const encData = ctxEnc.createImageData(w, h);
            const decData = ctxDec.createImageData(w, h);
            
            const enc = encData.data;
            const dec = decData.data;

            const mIdx = [0, 2, 5, 7, 8, 10, 13, 15];
            const gIdx = [1, 3, 4, 6, 9, 11, 12, 14];
            const rIdx = [5, 7, 13, 15];
            const bIdx = [0, 2, 8, 10];
            
            const boost = parseInt(boostSlider.value);

            for (let y = 0; y < h; y += 4) {
                for (let x = 0; x < w; x += 4) {
                    let sumR = 0, sumB = 0, sumG = 0;

                    for (let i = 0; i < 16; i++) {
                        const px = x + (i % 4);
                        const py = y + Math.floor(i / 4);
                        const p = (py * w + px) * 4;
                        sumR += src[p];
                        sumG += src[p + 1];
                        sumB += src[p + 2];
                    }

                    const avgR = sumR / 16;
                    const avgB = sumB / 16;
                    const avgG = sumG / 16;

                    for (let i = 0; i < 16; i++) {
                        const px = x + (i % 4);
                        const py = y + Math.floor(i / 4);
                        const p = (py * w + px) * 4;

                        const origR = src[p];
                        const origG = src[p + 1];
                        const origB = src[p + 2];

                        if (mIdx.includes(i)) {
                            let eR = origR;
                            let eB = origB;
                            
                            if (rIdx.includes(i)) eR = Math.min(255, eR + boost);
                            if (bIdx.includes(i)) eB = Math.min(255, eB + boost);

                            enc[p] = eR;
                            enc[p + 1] = 0;
                            enc[p + 2] = eB;
                            enc[p + 3] = 255;

                            dec[p] = eR;
                            dec[p + 1] = avgG; 
                            dec[p + 2] = eB;
                            dec[p + 3] = 255;
                        } 
                        else if (gIdx.includes(i)) {
                            enc[p] = 0;
                            enc[p + 1] = origG;
                            enc[p + 2] = 0;
                            enc[p + 3] = 255;

                            dec[p] = avgR;
                            dec[p + 1] = origG; 
                            dec[p + 2] = avgB;
                            dec[p + 3] = 255;
                        }
                    }
                }
            }

            ctxEnc.putImageData(encData, 0, 0);
            ctxDec.putImageData(decData, 0, 0);
        });
    </script>
</body>
</html>
