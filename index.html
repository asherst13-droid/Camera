<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Инструмент анализа</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .controls {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            border: 1px solid #333;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        label { font-size: 13px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
        input[type="file"] {
            padding: 8px;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #ccc;
            border-radius: 4px;
            cursor: pointer;
        }
        button {
            padding: 10px 24px;
            background: #333;
            color: white;
            border: 1px solid #555;
            border-radius: 4px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background: #444; border-color: #777; }
        
        .canvas-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .canvas-box {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #333;
        }
        h3 { margin-top: 0; font-size: 14px; color: #666; font-weight: normal; }
        canvas {
            background: #000;
            border: 1px solid #333;
            max-width: 100%;
            height: auto;
            image-rendering: pixelated; /* Сохраняет четкость пикселей 1:1 */
        }
        .info {
            margin-top: 8px;
            font-size: 11px;
            color: #555;
        }
    </style>
</head>
<body>

    <div class="controls">
        <div class="control-group">
            <label>Файл</label>
            <input type="file" id="imageInput" accept="image/*">
        </div>
        
        <div class="control-group">
            <label>Чувствительность: <span id="threshVal">30</span></label>
            <input type="range" id="threshold" min="0" max="100" value="30">
        </div>

        <button id="analyzeBtn">Обработать</button>
    </div>

    <div class="canvas-container">
        <div class="canvas-box">
            <h3>Оригинал</h3>
            <canvas id="originalCanvas"></canvas>
        </div>
        <div class="canvas-box">
            <h3>Результат (M-канал, 2 бита)</h3>
            <canvas id="patternCanvas"></canvas>
            <div class="info">Размер 1:1. 4 градации яркости (0, 85, 170, 255).</div>
        </div>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const originalCanvas = document.getElementById('originalCanvas');
        const patternCanvas = document.getElementById('patternCanvas');
        const ctxOrig = originalCanvas.getContext('2d');
        const ctxPat = patternCanvas.getContext('2d');
        
        const threshSlider = document.getElementById('threshold');
        threshSlider.oninput = () => document.getElementById('threshVal').innerText = threshSlider.value;

        let sourceImage = null;

        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                sourceImage = new Image();
                sourceImage.onload = () => {
                    // Ограничиваем максимальный размер для производительности, но сохраняем пропорции
                    const maxSize = 800; 
                    let w = sourceImage.width;
                    let h = sourceImage.height;
                    
                    if (w > maxSize || h > maxSize) {
                        if (w > h) { h = (h / w) * maxSize; w = maxSize; }
                        else { w = (w / h) * maxSize; h = maxSize; }
                    }
                    
                    // Выравниваем по сетке 4x4
                    w = Math.floor(w / 4) * 4;
                    h = Math.floor(h / 4) * 4;

                    originalCanvas.width = w;
                    originalCanvas.height = h;
                    ctxOrig.drawImage(sourceImage, 0, 0, w, h);
                };
                sourceImage.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        analyzeBtn.addEventListener('click', () => {
            if (!sourceImage) { alert("Загрузите изображение"); return; }
            
            const w = originalCanvas.width;
            const h = originalCanvas.height;
            const imgData = ctxOrig.getImageData(0, 0, w, h);
            const data = imgData.data;

            // Позиции в блоке 4x4 (0-15)
            const blueIndices = [0, 2, 8, 10];
            const redIndices = [5, 7, 13, 15];
            const allCheckerIndices = [0, 2, 5, 7, 8, 10, 13, 15];

            const threshold = parseInt(threshSlider.value);
            
            // 4 градации яркости (2 бита)
            const levels = [0, 85, 170, 255];

            // Канвас результата в оригинальном размере 1:1
            patternCanvas.width = w;
            patternCanvas.height = h;
            const patData = ctxPat.createImageData(w, h);

            for (let y = 0; y < h; y += 4) {
                for (let x = 0; x < w; x += 4) {
                    let sumR = 0, sumB = 0;
                    
                    // 1. Сбор данных блока 4x4
                    for (let by = 0; by < 4; by++) {
                        for (let bx = 0; bx < 4; bx++) {
                            const idx = ((y + by) * w + (x + bx)) * 4;
                            sumR += data[idx];
                            sumB += data[idx + 2];
                        }
                    }
                    
                    const avgR = sumR / 16;
                    const avgB = sumB / 16;
                    const diff = avgR - avgB;
                    
                    // Базовый уровень яркости маженты (0, 1, 2 или 3)
                    const magentaIntensity = Math.min(255, avgR + avgB);
                    let baseLevel = Math.round(magentaIntensity / 85);
                    baseLevel = Math.max(0, Math.min(3, baseLevel));

                    // 2. Распределение уровней по сетке
                    const blockLevels = new Array(16).fill(0);

                    if (diff > threshold) { 
                        // Доминирует красный
                        redIndices.forEach(i => blockLevels[i] = Math.min(3, baseLevel + 1));
                        blueIndices.forEach(i => blockLevels[i] = Math.max(0, baseLevel - 1));
                        // Остальные клетки шахматки остаются на базовом уровне
                        allCheckerIndices.forEach(i => {
                            if (!redIndices.includes(i) && !blueIndices.includes(i)) {
                                blockLevels[i] = baseLevel;
                            }
                        });
                    } 
                    else if (diff < -threshold) { 
                        // Доминирует синий
                        blueIndices.forEach(i => blockLevels[i] = Math.min(3, baseLevel + 1));
                        redIndices.forEach(i => blockLevels[i] = Math.max(0, baseLevel - 1));
                        allCheckerIndices.forEach(i => {
                            if (!redIndices.includes(i) && !blueIndices.includes(i)) {
                                blockLevels[i] = baseLevel;
                            }
                        });
                    } 
                    else { 
                        // Нейтральный участок
                        allCheckerIndices.forEach(i => blockLevels[i] = baseLevel);
                    }

                    // 3. Запись результата в канвас 1:1
                    for (let i = 0; i < 16; i++) {
                        const bx = i % 4;
                        const by = Math.floor(i / 4);
                        const px = x + bx;
                        const py = y + by;
                        const pIdx = (py * w + px) * 4;
                        
                        const brightness = levels[blockLevels[i]];
                        
                        patData.data[pIdx] = brightness;     // R
                        patData.data[pIdx + 1] = 0;          // G (отключен)
                        patData.data[pIdx + 2] = brightness; // B
                        patData.data[pIdx + 3] = 255;        // Alpha
                    }
                }
            }

            ctxPat.putImageData(patData, 0, 0);
        });
    </script>
</body>
</html>
